# Deploy blueprint for Render.com (free-tier compatible)
# In Render: New + → "Blueprint" → connect your repo → it reads this file.
#
# NOTE: Render's FREE tier has no persistent disk, so the SQLite database resets
# to the seeded starter stories whenever the service restarts or wakes from sleep.
# Fine for a quick look; for real testing where friends' submissions/comments must
# persist, either upgrade this service to a paid plan and add a disk, or switch the
# database to a free cloud DB (see DEPLOY.md).
services:
  - type: web
    name: quietly-here
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: ADMIN_USER
        sync: false          # you set this in the Render dashboard
      - key: ADMIN_PASS
        sync: false          # you set this in the Render dashboard
      - key: CANONICAL_HOST
        sync: false          # e.g. quietly-here.quiettruths.co.ke — 301-redirects other hosts (old onrender.com URL) to this
      - key: APP_URL
        sync: false          # e.g. https://quietly-here.quiettruths.co.ke — base for links in emails & sitemap; falls back to request host if unset
