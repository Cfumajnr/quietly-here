<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#155E5A">
<title>Quietly Here</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Quietly Here">
<link rel="stylesheet" href="/app.css">
<link rel="stylesheet" href="/app-shell.css">
</head>
<body>
<div class="phone">
  <div class="frame">
    <div class="screen" id="screen">
      <main id="scrollarea" role="main" tabindex="-1"><div class="loading">Loading…</div></main>
      <button class="fab" id="fab" data-action="open-submit" title="Write a story">✍️</button>
      <nav class="nav" id="nav">
        <button class="nitem" data-action="nav-home"><span class="ic">🏠</span><span>Home</span></button>
        <button class="nitem" data-action="nav-search"><span class="ic">🔍</span><span>Search</span></button>
        <button class="nitem" data-action="nav-library"><span class="ic">📚</span><span>Library</span></button>
      </nav>
      <div id="drawer" class="hidden"></div>
      <div id="toast"></div>
      <div id="modal" class="hidden"></div>
    </div>
  </div>
</div>
<script src="/app.js"></script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch(() => {}));
  }
</script>
</body>
</html>
